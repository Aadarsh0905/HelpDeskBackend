spring.application.name=helpdesk-backend
server.port=${PORT:8080}

# ==========================================
# TiDB Cloud (AWS Tokyo) Database Configuration
# Cluster: banking-system-db | DB: helpdesk
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/helpdesk?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:34f53Yxe3VE5yJg.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:A0n3G4aj4q1dLOpn}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Spring AI Ollama Configuration
# ==========================================
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:https://monetary-inch-php-precious.trycloudflare.com}
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL:llama3.1}

# ==========================================
# Spring AI JDBC Chat Memory (TiDB Compatible)
# ==========================================
spring.ai.chat.memory.repository.jdbc.platform=mysql
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.spring.ai.helpdesk=DEBUG
